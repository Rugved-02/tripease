<form [formGroup]="form1" (ngSubmit)="onSubmit()" >
<div id="register" style="box-shadow: 2px 2px 10px 3px rgb(55, 255, 145);">    
<h2 style="text-align: center; color: aliceblue;">Register</h2>      
<p-floatlabel variant="on">
    <input pInputText id="username" formControlName="username" autocomplete="off" />
    <label for="username">User Name</label>
</p-floatlabel>
<br>
<p-floatlabel variant="on">
    <p-inputnumber  inputId="number"  />
    <label for="number"> Number</label>
</p-floatlabel>
<br>
<p-floatlabel variant="on">
    <input pInputText id="email"  autocomplete="off" />
    <label for="emial">Email</label>
</p-floatlabel>
<br>
<p-floatlabel variant="on">
    <p-password  [toggleMask]="true" formControlName="password" />
    <label for="pass">Password</label>
</p-floatlabel>
<br>
<p-floatlabel variant="on">
    <p-password  [toggleMask]="true" />
    <label for="pass">Confirm Password</label>
</p-floatlabel>
<br>
<div id="button">
<p-button label="Login" [raised]="true" severity="success" (click)="login()" />
<p-button label="Register" type="submit" [raised]="true" severity="success" />
</div>

</div>
</form>
