<div class="container">
  <div class="inside-container">
   
    <div class="page-header">
      <div>
        <h1>My Itineraries</h1>
        <p>View and manage your travel plans</p>
      </div>
      <button pButton label=" + Create New Itinerary" icon="pi pi-plus" class="black-button"></button>
    </div>
 
    <div class="itinerary-card">
     
      <div class="card-header">
        <div class="header-left">
          <h2>Los Angeles Business Trip</h2>
          <div class="date-range">
            <i class="pi pi-calendar"></i> Feb 15, 2026 &rarr; Feb 20, 2026
          </div>
        </div>
        <div class="activity-badge">3 Activities</div>
      </div>
 
      <p-timeline [value]="events" align="left">
       
        <ng-template pTemplate="marker" let-event>
          <span class="custom-marker" [style.backgroundColor]="event.color">
           
            <ng-container [ngSwitch]="event.iconType">
 
              <svg *ngSwitchCase="'flight'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
              </svg>
 
              <svg *ngSwitchCase="'hotel'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                <path d="M10 22v-4h4v4"></path>
                <circle cx="10" cy="7" r="1"></circle>
                <circle cx="14" cy="7" r="1"></circle>
                <circle cx="10" cy="12" r="1"></circle>
                <circle cx="14" cy="12" r="1"></circle>
              </svg>
 
              <svg *ngSwitchCase="'location'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
 
            </ng-container>
 
          </span>
        </ng-template>
 
        <ng-template pTemplate="content" let-event>
          <div class="event-box">
            <div class="event-details">
              <span class="event-time"><i class="pi pi-clock"></i> {{event.time}}</span>
              <h3>{{event.title}}</h3>
              <p>{{event.subtitle}}</p>
            </div>
            <button pButton label="Edit" class="p-button-text p-button-sm edit-btn"></button>
          </div>
        </ng-template>
 
      </p-timeline>
 
      <div class="card-footer">
        <button pButton label="View Details" class="p-button-outlined p-button-secondary"></button>
        <button pButton label="Share Itinerary" class="p-button-outlined p-button-secondary"></button>
        <button pButton label="Download PDF" class="black-button"></button>
      </div>
 
    </div>
  </div>
</div>
