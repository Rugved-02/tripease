<p>menubar-component works!</p>
<div class="card">
    <p-menubar [model]="items">
        <ng-template #end>
            <div class="card flex flex-col items-center gap-4">
                <div class="flex flex-wrap gap-4 justify-center">
                    
                    <p-button label="LogIn" icon="pi-sign-in" />&nbsp;&nbsp;
                    <p-button label="Register" icon="pi-user-plus" />
                </div>
                
            </div>
        </ng-template>
    </p-menubar>
</div>
