
<header class="app-header">
<div class="header-left">
<p-button label="Home" [raised]="true" severity="success" (click)="home()"/>
<span class="divider">|</span>
@if(dark){
    <i class="pi pi-sun" label="Toggle Dark Mode" (click)="toggleLight()"></i>
}
@else{
    <i class="pi pi-moon" label="Toggle Dark Mode" (click)="toggleDark()"></i>
}

<br>
<hr>
</div>
</header>


<main class="app-main">
<router-outlet></router-outlet>
</main>
