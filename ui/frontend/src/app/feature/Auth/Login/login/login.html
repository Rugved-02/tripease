<p-toast position="top-right" />

<div class="login-container">
    <p-card class="login-card">
        <div class="brand-header">
            <div class="logo-box" routerLink="/homepage">
                          <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="lucide lucide-plane w-6 h-6 text-white"
                            >
                                <path
                                d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"
                                ></path>
                            </svg>
               
                
            </div>
            <div class="tripease-heading">
            <h1 class="brand-name" routerLink="/homepage">TripEase</h1>
            </div>

        </div>

        <div class="welcome-section">
            <h2 class="welcome-title">Welcome Back</h2>
            <p class="text-muted">Sign in to continue your journey</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-field">
                <label class="field-label">&nbsp;&nbsp;<i class="pi pi-envelope"></i> Email Address</label>
                <input pInputText type="text" formControlName="email" placeholder="you@example.com" class="w-full custom-input" />
                <div class="error-message-wrapper">
                    @if (isInvalid('email')) {
                        <small class="p-error">&nbsp;&nbsp;Email is required.</small>
                    }
                </div>
            </div>

            <div class="form-field">
                <label class="field-label">&nbsp;&nbsp;<i class="pi pi-lock"></i> Password</label>
                <p-password formControlName="password" [feedback]="false" [toggleMask]="true"
                    placeholder="Enter your password" styleClass="w-full" inputStyleClass="custom-input">
                </p-password>
                <div class="error-message-wrapper">
                    @if (isInvalid('password')) {
                        <small class="p-error">&nbsp;&nbsp;Password is required.</small>
                    }
                </div>
            </div>

            <div class="options-row">
                <div class="flex align-items-center gap-2">
                    <p-checkbox inputId="remember" binary="true"></p-checkbox>
                    <label for="remember" class="text-sm">Remember me</label>
                </div>
                <p-button label="Forgot password?" [link]="true" (click)="onForgotPassword()" styleClass="forgot-password-btn"></p-button>
            </div>

            <p-button type="submit" label="Sign In" styleClass="signin-btn w-full" />

            <div class="separator">
                <span>Or continue with</span>
            </div>

            <div class="social-grid">
                <p-button styleClass="social-btn" icon="pi pi-google" label="Google"></p-button>
                <p-button styleClass="social-btn" icon="pi pi-github" label="GitHub"></p-button>
            </div>

            <div class="signup-footer">
                <span class="text-muted">Don't have an account?</span>
                <p-button label="Sign up for free" [link]="true" (click)="register()" styleClass="signup-link-btn"></p-button>
            </div>
        </form>
    </p-card>
</div>
