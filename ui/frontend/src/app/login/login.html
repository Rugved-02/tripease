

<p-toast position="top-right" />
<div class="login-container">
    <p-card header="Login" class="login-card">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

            <div class="form-field">
                <p-floatlabel variant="on">
                     <input pInputText type="text" formControlName="username" [invalid]="isInvalid('username')" />
                     <label for="username">Username</label>
                </p-floatlabel>

                <div class="error-message-wrapper">
                  @if (isInvalid('username')) {
                  <p-message severity="error" size="small" variant="simple">
                   Username is required.
                 </p-message>
                 }
                </div>
            </div>

            <div class="form-field">
                  <p-floatlabel variant="on">
                     <p-password formControlName="password" [feedback]="false" [toggleMask]="true"
                       [invalid]="isInvalid('password')" styleClass="w-full">
                     </p-password>
                     <label for="password">Password</label>
                    </p-floatlabel>

             <div class="error-message-wrapper">
                 @if (isInvalid('password')) {
                     @if (loginForm.get('password')?.errors?.['required']) {
                        <p-message severity="error" size="small" variant="simple">Password is required.</p-message>
                     }
                 @if (loginForm.get('password')?.errors?.['minlength']) {
                       <p-message severity="error" size="small" variant="simple">Password is too short.</p-message>
                      }
                  }
            </div>
            <div class="forgot-password-container">
                   <p-button label="Forgot password?" [link]="true" (click)="onForgotPassword()"
                     styleClass="forgot-password-btn" size="small">
                  </p-button>
             </div>
        </div>

            
            <p-button type="submit" pRipple label="Login" class="w-full" />


            <div class="signup-footer">
                <span class="text-muted">Not a user?</span>
                <p-button class="signup-link" label="Sign up" [link]="true" (click)="register()" styleClass="signup-btn">
                </p-button>
            </div>

        </form>
    </p-card>
</div>
