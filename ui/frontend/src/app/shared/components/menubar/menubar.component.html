<div class="sticky-navbar">
  <p-menubar [model]="items" [dt]="">
    <ng-template #item let-item>
      <a [routerLink]="item.routerLink" class="p-menubar-item-link flex items-center p-3 gap-2">
        @if (item.icon === 'custom-plane') {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"
            ></path>
          </svg>
        } @else {
          <span [class]="item.icon"></span>
        }

        <span class="ml-2">{{ item.label }}</span>
      </a>
    </ng-template>

    <ng-template #start>
      <div class="logo-tripease-wrapper">
        <app-logo-text></app-logo-text>
      </div>
    </ng-template>

    <ng-template #end>
      @if (isLoggedIn()) {
        <div class="profile-wrapper">
          <button class="round-btn" (click)="toggleProfileMenu()">P</button>

          <!-- DROPDOWN -->
          <div class="profile-menu" *ngIf="showProfileMenu">
            <div
              class="menu-item"
              (click)="redirectToDashboard()"
              role="button"
              tabindex="0"
              (keydown.enter)="redirectToDashboard()"
            >
              <i class="pi pi-user"></i>
              <span>Dashboard</span>
            </div>

            <div
              class="menu-item"
              (click)="redirectToTrips()"
              role="button"
              tabindex="0"
              (keydown.enter)="redirectToTrips()"
            >
              <i class="pi pi-calendar"></i>
              <span>My Trips</span>
            </div>

            <div
              class="menu-item"
              (click)="redirectToAnalytics()"
              role="button"
              tabindex="0"
              (keydown.enter)="redirectToAnalytics()"
            >
              <i class="pi pi-chart-bar"></i>
              <span>Analytics</span>
            </div>

            <div class="menu-divider"></div>
            <div
              class="menu-item logout"
              (click)="onLogout()"
              role="button"
              tabindex="0"
              (keydown.enter)="onLogout()"
            >
              <i class="pi pi-sign-out"></i>
              <span>Log out</span>
            </div>
          </div>
        </div>
      } @else {
        <div class="login-signup-wrapper">
          <p-button
            [style]="loginButtonStyle"
            label="LogIn"
            icon="pi pi-sign-in"
            iconPos="right"
            [rounded]="false"
            [raised]="false"
            size="small"
            (click)="directLogin()"
            [dt]=""
          ></p-button
          >&nbsp;&nbsp;
          <p-button
            [style]="signUpButtonStyle"
            label="Sign Up"
            icon="pi pi-user-plus"
            iconPos="right"
            [rounded]="false"
            [raised]="true"
            size="small"
            (click)="directSignup()"
          />
        </div>
      }
    </ng-template>
  </p-menubar>
</div>
