server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Helps automatically locate services
      routes:
        # Route for Flight Service
        - id: flight-service-route
          uri: lb://FLIGHT-SERVICE  # CHANGED: Use Load Balanced Service Name
          predicates:
            - Path=/flight/** # Matches controller @RequestMapping("flight")

        # Route for Course Service
        - id: course-service-route
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/courses/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/