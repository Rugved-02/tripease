<div class="tab-container">
  <div class="tabs-header">
    <div (click)="setTab('flights')" 
         [class]="activeTab === 'flights' ? 'tab-item tab-active' : 'tab-item tab-inactive'">
      <svg class="tab-item-icon"  xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg> Flights
    </div>
    
    <div (click)="setTab('hotels')" 
         [class]="activeTab === 'hotels' ? 'tab-item tab-active' : 'tab-item tab-inactive'">
      <svg class="tab-item-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22v-6.57"></path><path d="M12 11h.01"></path><path d="M12 7h.01"></path><path d="M14 15.43V22"></path><path d="M15 16a5 5 0 0 0-6 0"></path><path d="M16 11h.01"></path><path d="M16 7h.01"></path><path d="M8 11h.01"></path><path d="M8 7h.01"></path><rect x="4" y="2" width="16" height="20" rx="2"></rect></svg> Hotels
    </div>
  </div>

  <div class="content-area">
    <!-- For FLIGHTS -->
      @if (activeTab === 'flights') {<div>
      <p-toast />
      <div class="main-card">
        <form [formGroup]="searchFlights" (ngSubmit)="onSubmitSearchFlights()">
          
          <div class="input-row">
            <div class="input-field">
              <label style-input-label-text for="fromCity">
                <i style-input-label-icon class="pi pi-map-marker custom"></i>From
              </label>
              <input pInputText style-input-field id="fromCity" formControlName="fromCity" placeholder="Enter City or Airport" fluid="true" />
              
              @if (isInvalid('fromCity')) {
                <p-message severity="error" size="small" variant="simple">Required</p-message>
              }
            </div>

            <div class="input-field">
              <label style-input-label-text for="toCity">
                <i style-input-label-icon class="pi pi-map-marker"></i>To
              </label>
              <input pInputText style-input-field id="toCity" formControlName="toCity" placeholder="Enter Destination" fluid="true" />
            </div>

            <div class="input-field">
              <label style-input-label-text for="dateFlightTravel">
                <i style-input-label-icon class="pi pi-calendar"></i>Date
              </label>
              <p-datepicker 
                id="dateFlightTravel" 
                class="style-date-picker"
                formControlName="selectedDate" 
                [showIcon]="false" 
                fluid="true" 
                placeholder="MM/DD/YYYY"
                ngSkipHydration />
            </div>
          </div>

          <button pButton severity="secondary" type="submit">
            <span pButtonLabel>
              <i style-search-button-icon class="pi pi-search"></i>Search Flights
            </span>
          </button>

        </form>
      </div>
    </div>}
    

    <!-- For HOTELS -->
      @if (activeTab === 'hotels') {<div>
      <form [formGroup]="searchHotels" (ngSubmit)="onSubmitSearchHotels()">
        
        <div class="input-row">
          <div class="input-field">
            <label style-input-label-text for="toCity">
              <i style-input-label-icon class="pi pi-map-marker"></i>To
            </label>
            <input pInputText style-input-field id="toCity" formControlName="toCity" placeholder="Enter City or Airport" fluid="true" />
          </div>

          <div class="input-field">
            <label style-input-label-text for="dateHotelTravel">
              <i style-input-label-icon class="pi pi-calendar"></i>Date
            </label>
            <p-datepicker 
              id="dateHotelTravel" 
              class="style-date-picker"
              formControlName="selectedDate" 
              [showIcon]="false" 
                fluid="true" 
                placeholder="MM/DD/YYYY"
              ngSkipHydration />
          </div>
        </div>

        <button pButton severity="secondary" type="submit">
          <span pButtonLabel>
            <i style-search-button-icon class="pi pi-search"></i>Search Hotels
          </span>
        </button>

      </form>
    </div>}
    
  </div>
</div>
