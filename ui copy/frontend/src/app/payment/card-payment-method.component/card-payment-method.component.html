<div class="card-details-container">
  <h2 class="section-title">Card Details</h2>

  <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="cardName">Cardholder Name</label>
      <input id="cardName" type="text" formControlName="cardName" placeholder="Enter Name">
      <div class="error-slot">
        <small *ngIf="paymentForm.get('cardName')?.touched && paymentForm.get('cardName')?.errors?.['required']">Name is required.</small>
        <small *ngIf="paymentForm.get('cardName')?.touched && paymentForm.get('cardName')?.errors?.['minlength']">Minimum 3 characters required.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="cardNumber">Card Number</label>
      <input id="cardNumber" type="text" formControlName="cardNumber" placeholder="1234 5678 9012 3456">
      <div class="error-slot">
        <small *ngIf="paymentForm.get('cardNumber')?.touched && paymentForm.get('cardNumber')?.errors?.['required']">Card number is required.</small>
        <small *ngIf="paymentForm.get('cardNumber')?.touched && paymentForm.get('cardNumber')?.errors?.['pattern']">Invalid card format.</small>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group half-width">
        <label for="expiryDate">Expiry Date</label>
        <input id="expiryDate" type="text" formControlName="expiryDate" placeholder="MM/YY">
        <div class="error-slot">
          <small *ngIf="paymentForm.get('expiryDate')?.touched && paymentForm.get('expiryDate')?.errors?.['required']">Required.</small>
          <small *ngIf="paymentForm.get('expiryDate')?.touched && paymentForm.get('expiryDate')?.errors?.['pattern']">Use MM/YY.</small>
        </div>
      </div>

      <div class="form-group half-width">
        <label for="cvv">CVV</label>
        <input id="cvv" type="password" formControlName="cvv" placeholder="123">
        <div class="error-slot">
          <small *ngIf="paymentForm.get('cvv')?.touched && paymentForm.get('cvv')?.errors?.['required']">Required.</small>
          <small *ngIf="paymentForm.get('cvv')?.touched && paymentForm.get('cvv')?.errors?.['pattern']">3-4 digits.</small>
        </div>
      </div>
    </div>

    <div class="security-banner">
      <i class="pi pi-lock"></i>
      <span>Your payment information is encrypted and secure</span>
    </div>

    <button type="submit" class="btn-submit">Complete Payment</button>
  </form>
</div>
