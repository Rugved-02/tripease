spring.application.name=flights
server.port=8083
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cts
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Expose the info and health endpoints
management.endpoints.web.exposure.include=health,info
# Optional: Add some custom info to show
info.app.name=Flights Service
info.app.description=Service for managing flight schedules and seats
info.app.version=1.0.0