spring.application.name=hotels
server.port=8083
# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/tripEase
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
# Force Hibernate to respect your @Column(name="...") exactly as written
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# REMOVE the MySQL8Dialect line. 
# Hibernate 7 auto-detects the version from the JDBC connection.